# 服务器监控面板 - 依赖锁定
#
# 用途：可复现的部署环境。
#     pip install -r requirements.lock
#
# 与 requirements.txt 的分工：
#   requirements.txt  —— 版本下限，声明"需要什么"，便于本地开发
#   requirements.lock —— 精确版本，声明"用哪个"，CI 与生产部署使用
#
# 本文件由当前验证通过的环境导出，非手工编写：
#   pip freeze | grep -iE "^(fastapi|httpx|...)=" > requirements.lock
#
# 升级依赖的流程：
#   1. pip install <包名>          # 装新版本
#   2. python -m pytest            # 必须全绿
#   3. 重新生成本文件
#   4. 提交时说明升级了什么、为何
#
# 注意：此处只锁"直接依赖 + 传递依赖"的当前已验证组合。
#       若需跨 Python 版本复现，改用 pip-tools 从 pyproject 生成。

