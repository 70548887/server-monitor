name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

# 同一分支的新推送会取消进行中的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest

    services:
      # CI 期间 MySQL 始终可用：部分测试需要真实 schema
      # （如 test_bootstrap 验证建表脚本），不可用时应明确失败
      # 而非静默跳过。
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_pw
          MYSQL_DATABASE: server_monitor_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest 相关工具不在 requirements.txt 中
          pip install pytest-cov

      - name: 配置测试环境变量
        run: |
          cat >> .env <<'EOF'
          MYSQL_HOST=127.0.0.1
          MYSQL_PORT=3306
          MYSQL_USER=root
          MYSQL_PASSWORD=test_root_pw
          MYSQL_DATABASE=server_monitor_test
          REDIS_HOST=
          ADMIN_USERNAME=admin
          ADMIN_PASSWORD=ci_test_password_123
          COOKIE_SECURE=false
          EOF

      - name: 运行测试
        run: |
          pytest -p no:warnings --cov=app --cov-report=term-missing:skip-covered

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore

  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 字节码编译检查
        # 捕获语法错误（缺括号、引号不匹配、缩进错误等）
        run: python -m compileall -q app scripts

      - name: 敏感信息扫描
        # .env 不应进入版本库
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "错误：.env 已被提交到版本库"
            exit 1
          fi

      - name: 检查常见密钥模式
        run: |
          # 排除示例文件、测试夹具与占位符
          PATTERNS='(smtp_password|DEFAULT_SMTP_PASSWORD|MYSQL_PASSWORD)\s*=\s*[^\s<${]+'
          if git grep -nE "$PATTERNS" -- \
            ':!.env.example' ':!tests/' ':!*.md' ':!.cursor/' 2>/dev/null; then
            echo "错误：检测到疑似硬编码的密码"
            exit 1
          fi

  docker:
    name: 构建镜像
    runs-on: ubuntu-latest
    # 仅在 master 或标签上构建镜像产物
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: server-monitor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
