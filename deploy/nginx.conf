# nginx 反向代理配置
#
# 职责：
#   - TLS 终止（应用侧不处理 HTTPS，COOKIE_SECURE 由 nginx 的 HTTPS 保证）
#   - 静态资源直出，不经过 uvicorn
#   - 保护 /metrics 与 /healthz 不被公网直接访问
#
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/server-monitor.conf
#   sudo ln -sf /etc/letsencrypt/live/<域名>/fullchain.pem \
#           /etc/nginx/conf.d/server-monitor.crt
#   sudo ln -sf /etc/letsencrypt/live/<域名>/privkey.pem \
#           /etc/nginx/conf.d/server-monitor.key
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书可用 certbot 自动续期：
#   sudo certbot --nginx -d monitor.example.com

# 本文件由 nginx.conf 的 http {} 中 include；zone 只能定义在 http 层。
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

# ---------- HTTP：仅用于跳转与证书签发 ----------
server {
    listen 80;
    listen [::]:80;
    server_name monitor.example.com;

    # certbot 的续期验证必须放行
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monitor.example.com;

    # ---------- TLS ----------
    ssl_certificate     /etc/nginx/conf.d/server-monitor.crt;
    ssl_certificate_key /etc/nginx/conf.d/server-monitor.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS：确认全站 HTTPS 后再开启
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # 监控面板不需要被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ---------- 限流 ----------
    # 登录接口是暴力破解的首要目标，单独收紧

    # ---------- 日志 ----------
    access_log /var/log/nginx/server-monitor.access.log;
    error_log  /var/log/nginx/server-monitor.error.log;

    # ---------- 上传大小 ----------
    # 验证码是 JSON，不需要大 body；限制可挡下部分 CC
    client_max_body_size 64k;

    # ---------- 静态资源：nginx 直出 ----------
    location /static/ {
        alias /opt/server-monitor/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- 运维端点：仅内网可访问 ----------
    # /metrics 暴露节点名与延迟等信息，不应公网可见
    location /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    # 健康检查留给容器/负载均衡探测，不记访问日志
    location /healthz {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # ---------- 登录：严格限流 ----------
    location = /login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 其余请求 ----------
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 应用依赖 X-Forwarded-For 取真实客户端 IP（限流与登录锁定都靠它）
        # 若不在 nginx 后运行，需确保 Host 头可信，见 ALLOWED_HOSTS
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # 面板多为轮询，关闭缓冲可让响应更及时
        proxy_buffering off;
    }
}

# ---------- 备选：Docker 部署时的差异 ----------
# 1. 上面的 `alias /opt/server-monitor/app/static/` 在容器部署下不存在，
#    需改为容器内路径，或直接删掉该 location 让请求转发给应用
# 2. 应用在容器里监听 0.0.0.0:8080（compose 已如此配置），
#    proxy_pass 保持 127.0.0.1:8080 即可（nginx 同在宿主机）
# 3. COOKIE_SECURE 保持 false —— 容器内是 HTTP，
#    由 nginx 对外提供 HTTPS 后，浏览器看到的仍是 HTTPS 连接