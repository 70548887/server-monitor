# 服务器监控面板 - 应用配置

# 应用信息
app:
  name: "server-monitor"
  version: "1.4.3"
  debug: false

# 数据库配置
# 注意：敏感信息（密码）建议通过环境变量配置，参见 .env.example
# 环境变量优先级高于此文件
database:
  mysql:
    host: "127.0.0.1"     # 可用环境变量 MYSQL_HOST 覆盖
    port: 3306            # 可用环境变量 MYSQL_PORT 覆盖
    user: "root"          # 可用环境变量 MYSQL_USER 覆盖
    password: ""          # 建议用环境变量 MYSQL_PASSWORD
    database: "server_monitor"  # 可用环境变量 MYSQL_DATABASE 覆盖
    pool_size: 10
    pool_recycle: 1800
  redis:
    host: "localhost"     # 可用环境变量 REDIS_HOST 覆盖
    port: 6379            # 可用环境变量 REDIS_PORT 覆盖
    db: 0
    password: ""          # 可用环境变量 REDIS_PASSWORD 覆盖
    prefix: "srvmon:"

# 调度器配置
scheduler:
  interval_seconds: 60      # 心跳检测间隔（秒）
  concurrency: 50           # 最大并发数
  # 瞬时错误（超时/连接失败）的重试，指数退避。
  # 抖动型故障往往第二次就成功，能显著降低误报率。
  # 单次请求的超时用各节点自己的 timeout_ms（见 nodes 表）。
  retry_count: 3            # 重试次数（不含首次）
  retry_delay_ms: 200       # 重试初始延迟（毫秒），后续按 2 倍递增

# 告警配置
alerting:
  enabled: true
  consecutive_failures: 3    # 连续失败N次触发告警
  latency_p95_ms: 2000       # p95延迟阈值（毫秒）
  error_rate_threshold: 0.05 # 错误率阈值（5%）

  # ===== 事件化提醒节奏（主控）=====
  # 一次故障 = 一个事件。提醒节奏由"距事件开始的时间"决定，
  # 与自然日无关 —— 跨午夜不会重新爆发，进程重启后节奏延续。
  #
  # reminder_intervals_minutes: 距事件开始多久提醒一次（分钟）
  #   下面这组 = 立即 / 1h / 4h / 8h / 12h，之后每 intervals_loop_minutes 循环
  #   前期密集（确保有人看见），后期稀疏（不再刷屏）
  reminder_intervals_minutes: [0, 60, 240, 480, 720]
  intervals_loop_minutes: 720    # 走完阶梯后的循环间隔（12h）
  # 单个事件的通知次数上限，0 = 不限（由阶梯自然收敛）
  max_notifications_per_incident: 0

  # ===== 升级提醒 =====
  # 故障持续超过该分钟数后，提醒主题加 [升级] 前缀，并跳过
  # "单节点每日发送上限" —— 长时间未恢复时，送达优先于抑制重复。
  # 最小发送间隔与可发送时段仍然生效，不会变成刷屏。
  # 0 = 不启用。建议配合上面的阶梯，例如设 720 表示 12 小时后升级。
  escalate_after_minutes: 0

  # suppress_minutes 现在只管 node_recovery 与 latency_high 这类
  # 容易抖动的告警；node_down 的节奏完全由上面的阶梯控制。
  suppress_minutes: 240
  suppress_persist: true     # 抑制状态写入 Redis，跨进程重启保持
  window_minutes: 5          # 统计窗口（分钟）
  channels:
    webhook:
      enabled: false
      url: ""
    email:
      enabled: false
      smtp_host: ""
      smtp_port: 587
      username: ""
      password: ""
      recipients: []

# 日志配置
logging:
  level: "INFO"
  format: "json"            # json 或 text
  file:
    enabled: true
    path: "logs/app.log"
    max_size_mb: 100
    backup_count: 7
  async_queue_size: 10000

# 数据留存
# 说明：样本表按"每分钟每节点一行"增长，100 个节点一年约 5000 万行，
# 必须定期清理。以下配置由调度器强制执行：
#   - aggregate_rollup   每小时把样本汇总到 aggregates 表
#   - retention_cleanup  每日 cleanup_hour 点清理过期数据
# 聚合表体积远小于原始样本，且是 7 天/30 天可用性的唯一数据来源
# （内存只保留 48 小时），因此保留期设得更长。
retention:
  enabled: true            # 关闭后样本表将无限增长，长周期可用性也不可用
  samples_days: 30         # 原始样本保留天数
  aggregates_days: 90      # 聚合快照保留天数
  cleanup_hour: 3          # 每日清理时刻（小时，0-23）

# 服务器配置
server:
  host: "0.0.0.0"
  port: 8080
