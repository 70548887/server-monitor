{% extends "layout.html" %}

{% block title %}趋势分析 - {{ title }}{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/css/trends.css">
{% endblock %}


{% block content %}
<div class="trends-page">
    <h1>趋势分析</h1>
    
    <!-- 筛选器 -->
    <div class="trends-filters">
        <div class="filter-group">
            <label>选择节点</label>
            <div class="node-selector" id="nodeSelector">
                <div class="selected-nodes" id="selectedNodes">
                    <span class="placeholder">点击选择节点...</span>
                </div>
                <div class="node-dropdown" id="nodeDropdown" style="display:none;">
                    <div class="node-dropdown-header">
                        <button type="button" class="btn btn-sm btn-secondary" onclick="selectAllNodes()">全选</button>
                        <button type="button" class="btn btn-sm btn-secondary" onclick="clearAllNodes()">清空</button>
                    </div>
                    <div class="node-list" id="nodeList">
                        {% for node in nodes %}
                        <label class="node-option">
                            <input type="checkbox" value="{{ node.name }}" onchange="updateSelectedNodes()">
                            <span>{{ node.name }}</span>
                        </label>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
        
        <div class="filter-group">
            <label>时间范围</label>
            <select id="timeRange" onchange="loadTrendsData()">
                <option value="6">6小时</option>
                <option value="12">12小时</option>
                <option value="24" selected>24小时</option>
                <option value="48">48小时</option>
                <option value="168">7天</option>
            </select>
        </div>
        
        <button class="btn btn-primary" onclick="loadTrendsData()">刷新数据</button>
    </div>
    
    <!-- 延迟对比统计 -->
    <div class="section">
        <h2>延迟统计对比</h2>
        <div class="stats-table-wrapper">
            <table class="table" id="latencyStatsTable">
                <thead>
                    <tr>
                        <th>节点</th>
                        <th>平均延迟</th>
                        <th>最大延迟</th>
                        <th>最小延迟</th>
                        <th>可用性</th>
                        <th>延迟等级</th>
                    </tr>
                </thead>
                <tbody id="latencyStatsBody">
                    <tr><td colspan="6" class="text-center">请选择节点后点击刷新</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- 延迟趋势图表 -->
    <div class="section">
        <h2>延迟趋势对比</h2>
        <div class="chart-container chart-large">
            <canvas id="latencyTrendChart"></canvas>
        </div>
    </div>
    
    <!-- 可用性趋势图表 -->
    <div class="section">
        <h2>可用性趋势对比</h2>
        <div class="chart-container chart-large">
            <canvas id="availabilityTrendChart"></canvas>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="/static/js/trends.js"></script>
{% endblock %}
